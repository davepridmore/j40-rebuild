<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">Rev P D01 lower support and connector arms fabrication control</title>
  <desc id="desc">Dimension-control sheet for X0, X1, A0 and A1. All final fabrication geometry is held until direct measurement and structural release.</desc>
  <defs>
    <style>
      .bg{fill:#f3f0e7}.ink{fill:#17231e}.muted{fill:#58645e}.line{fill:none;stroke:#24352d;stroke-width:4}.thin{fill:none;stroke:#65766d;stroke-width:2}.dash{fill:none;stroke:#8a5c24;stroke-width:3;stroke-dasharray:12 9}.hold{fill:#7d3fa0}.green{fill:#315f48}.amber{fill:#8a5c24}.white{fill:#fff}.steel{fill:#d6ddd8;stroke:#24352d;stroke-width:4}.rubber{fill:#222b27;stroke:#111;stroke-width:3}.dim{fill:none;stroke:#7d3fa0;stroke-width:2}.load{fill:none;stroke:#c0563f;stroke-width:5}.title{font:700 38px Arial,sans-serif}.h2{font:700 25px Arial,sans-serif}.h3{font:700 19px Arial,sans-serif}.body{font:17px Arial,sans-serif}.small{font:14px Arial,sans-serif}.label{font:700 15px Arial,sans-serif;letter-spacing:1px}.mono{font:700 16px ui-monospace,SFMono-Regular,monospace}
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#c0563f"/></marker>
    <marker id="dimArrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M0 4L8 0 8 8Z" fill="#7d3fa0"/></marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#d8d3c9" stroke-width="1"/></pattern>
  </defs>
  <rect class="bg" width="1600" height="1100"/><rect width="1600" height="1100" fill="url(#grid)" opacity=".55"/>
  <rect x="42" y="38" width="1516" height="1024" rx="18" fill="#fffdf8" stroke="#24352d" stroke-width="3"/>
  <text x="82" y="100" class="title ink">REV P · D01 — LOWER SUPPORT + CONNECTOR ARMS</text>
  <text x="82" y="136" class="body muted">X0 · X1-L/R · A0-L/R · A1-L/R | schematic only; actual templates and signed structural drawing control manufacture</text>
  <rect x="1264" y="66" width="246" height="78" rx="9" fill="#f0e6f6" stroke="#7d3fa0" stroke-width="3"/>
  <text x="1288" y="99" class="label hold">FABRICATION STATUS</text><text x="1288" y="127" class="h3 hold">FINAL GEOMETRY: HOLD</text>

  <rect x="78" y="180" width="958" height="635" rx="14" fill="#f8f6ef" stroke="#aab3ad" stroke-width="2"/>
  <text x="108" y="222" class="h2 ink">FRONT ELEVATION · released load-path intent</text>
  <line x1="555" y1="255" x2="555" y2="772" class="dash"/><text x="571" y="277" class="label amber">VCL</text>

  <!-- photo-backed radiator envelope, deliberately schematic -->
  <rect x="316" y="288" width="478" height="304" rx="12" fill="#e4eee7" stroke="#315f48" stroke-width="4" stroke-dasharray="11 8"/>
  <rect x="338" y="314" width="434" height="236" fill="#cad9cf" stroke="#315f48" stroke-width="2"/>
  <rect x="673" y="269" width="45" height="28" rx="8" fill="#cad9cf" stroke="#315f48" stroke-width="3"/>
  <text x="344" y="347" class="h3 green">R0 actual part controls identity</text>
  <text x="344" y="374" class="body green">≈610 mm body / ≈635 mm cap</text>
  <text x="344" y="399" class="small green">LOCKED FOR MOCK-UP only</text>

  <!-- saddles and crossmember -->
  <path d="M365 589q0 42 44 42h28q44 0 44-42" class="rubber"/><path d="M631 589q0 42 44 42h28q44 0 44-42" class="rubber"/>
  <rect x="340" y="625" width="166" height="24" class="steel"/><rect x="606" y="625" width="166" height="24" class="steel"/>
  <rect x="282" y="661" width="546" height="54" class="steel"/>
  <text x="518" y="695" class="h3 ink">X0</text><text x="357" y="644" class="small ink">X1-L</text><text x="624" y="644" class="small ink">X1-R</text>

  <!-- arms -->
  <rect x="282" y="686" width="58" height="90" class="steel"/><rect x="770" y="686" width="58" height="90" class="steel"/>
  <path d="M273 776h76l20 24v24h-116v-24z" class="steel"/><path d="M761 776h76l20 24v24h-116v-24z" class="steel"/>
  <circle cx="311" cy="802" r="10" fill="#fff" stroke="#24352d" stroke-width="4"/><circle cx="799" cy="802" r="10" fill="#fff" stroke="#24352d" stroke-width="4"/>
  <text x="181" y="724" class="h3 ink">A0-L</text><text x="846" y="724" class="h3 ink">A0-R</text><text x="182" y="810" class="h3 ink">A1-L</text><text x="864" y="810" class="h3 ink">A1-R</text>

  <!-- load arrows -->
  <path d="M423 494v115" class="load" marker-end="url(#arrow)"/><path d="M689 494v115" class="load" marker-end="url(#arrow)"/>
  <path d="M423 649l-112 68v54" class="load" marker-end="url(#arrow)"/><path d="M689 649l110 68v54" class="load" marker-end="url(#arrow)"/>
  <text x="465" y="472" class="label" fill="#c0563f">R0 WEIGHT → TWO R1 SADDLES</text>

  <!-- dimensions -->
  <line x1="282" y1="750" x2="828" y2="750" class="dim" marker-start="url(#dimArrow)" marker-end="url(#dimArrow)"/><text x="443" y="739" class="mono hold">L0 + END JOINTS — HOLD</text>
  <line x1="874" y1="686" x2="874" y2="824" class="dim" marker-start="url(#dimArrow)" marker-end="url(#dimArrow)"/><text x="895" y="761" class="mono hold">ARM HEIGHT — HOLD</text>

  <rect x="1066" y="180" width="444" height="635" rx="14" fill="#f8f6ef" stroke="#aab3ad" stroke-width="2"/>
  <text x="1096" y="222" class="h2 ink">A1 CONNECTOR END DETAIL</text>
  <text x="1096" y="253" class="body muted">Make separately from each rigid A0-D-L/R template.</text>
  <path d="M1142 330h270v58h-80v138h-110V388h-80z" class="steel"/>
  <path d="M1200 526l-34 65v68h222v-68l-34-65" class="steel"/>
  <circle cx="1235" cy="615" r="13" fill="#fff" stroke="#24352d" stroke-width="4"/><circle cx="1319" cy="615" r="13" fill="#fff" stroke="#24352d" stroke-width="4"/>
  <line x1="1235" y1="681" x2="1319" y2="681" class="dim" marker-start="url(#dimArrow)" marker-end="url(#dimArrow)"/><text x="1191" y="714" class="mono hold">HOLE GROUP / BEARING: HOLD</text>
  <text x="1097" y="760" class="small muted">NO new chassis holes · NO slots · NO forced pull</text>
  <text x="1097" y="785" class="small muted">NO washer-stack spacers · NO assumed symmetry</text>

  <rect x="78" y="844" width="1432" height="176" rx="14" fill="#eef1ec" stroke="#aab3ad" stroke-width="2"/>
  <text x="108" y="884" class="h2 ink">RELEASE CHECKS</text>
  <text x="108" y="921" class="body ink">1  A0-D-L/R templates: connector faces, axes, holes, bearing, section, access, drainage and removal path.</text>
  <text x="108" y="950" class="body ink">2  S0 + selected R1: locator centres, installed rubber height and full-area X1 seats. L0 + filled/capped MR recorded.</text>
  <text x="108" y="979" class="body ink">3  Structural release: material, section, joints, edge distance, welds/WPS, fasteners, torque and proof fixture.</text>
  <rect x="1170" y="885" width="302" height="94" rx="10" fill="#f6e8e3" stroke="#c0563f" stroke-width="3"/>
  <text x="1195" y="919" class="label" fill="#c0563f">PROOF AFTER RELEASE</text><text x="1195" y="951" class="h2" fill="#c0563f">2 × MR · 10 MIN</text>
  <text x="82" y="1048" class="small muted">REV P D01 · 16 AUG 2026 · drawing is a measurement/release map, not a cut-ready fabrication drawing</text>
</svg>
