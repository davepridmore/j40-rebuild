  <text x="24" y="136" class="note">Finished free height: 22 mm. The DXF is the top cut profile only; height is controlled by the PDF and cut list.</text><text x="24" y="146" class="note">Central through bore is 18.0 mm for Toyota 90560-12009 style sleeve clearance; this is a through cut.</text><text x="24" y="156" class="note">Plan corner radius target R1.5. Top/bottom perimeter edge break or chamfer target 1.0 mm max. Faces flat and parallel within 0.5 mm.</text><text x="24" y="166" class="note">This replaces the older circular BM-SM/BM-LG placeholder for the active Longman rubber order.</text>
