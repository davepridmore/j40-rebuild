<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
  <title id="title">J40 bump stop vehicle measurement control</title>
  <desc id="desc">J40 bump-stop measurement diagram showing photo-derived nominal dimensions, metal fixture-ear mounting holes, and the remaining direct-measurement controls.</desc>
  <rect width="900" height="540" fill="#f7f7f4"/>
  <style>
    .label { font: 15px Arial, sans-serif; fill: #222; }
    .small { font: 12px Arial, sans-serif; fill: #333; }
    .tiny { font: 11px Arial, sans-serif; fill: #333; }
    .title { font: 700 22px Arial, sans-serif; fill: #111; }
    .part { fill: #2f3136; stroke: #111; stroke-width: 2; }
    .rubber { fill: #111; stroke: #000; stroke-width: 2; }
    .steel { fill: #8d9297; stroke: #333; stroke-width: 2; }
    .hole { fill: #fff; stroke: #c43a31; stroke-width: 4; }
    .pad { fill: #b9c4ca; stroke: #333; stroke-width: 2; }
    .dim { stroke: #c43a31; stroke-width: 2; fill: none; marker-start: url(#arrow); marker-end: url(#arrow); }
    .guide { stroke: #666; stroke-width: 1.5; stroke-dasharray: 6 5; fill: none; }
    .axis { stroke: #2364aa; stroke-width: 2; fill: none; marker-end: url(#arrowBlue); }
    .hole-axis { stroke: #2364aa; stroke-width: 1.4; stroke-dasharray: 4 3; fill: none; }
    .callout { stroke: #2364aa; stroke-width: 1.7; fill: none; marker-end: url(#arrowBlue); }
    .callout-box { fill: #fff; stroke: #d5d2ca; stroke-width: 1.2; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c43a31"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2364aa"/>
    </marker>
  </defs>

  <text x="34" y="42" class="title">Bump Stop Control - Photo Nominals Plus Direct Verification</text>

  <text x="58" y="88" class="label">Side view</text>
  <rect x="84" y="115" width="210" height="30" rx="3" class="rubber"/>
  <path d="M120 145 L260 145 L232 295 L148 295 Z" class="rubber"/>
  <rect x="128" y="295" width="124" height="36" rx="4" class="part"/>
  <rect x="92" y="380" width="194" height="34" rx="5" class="pad"/>
  <line x1="84" y1="145" x2="294" y2="145" class="guide"/>
  <line x1="92" y1="380" x2="286" y2="380" class="guide"/>
  <path d="M318 145 L318 295" class="dim"/>
  <text x="330" y="226" class="label">H</text>
  <text x="330" y="248" class="small">~70 photo: long-family sample</text>
  <text x="330" y="264" class="small">60 mm: 48304-60020</text>
  <path d="M300 331 L300 380" class="dim"/>
  <text x="318" y="359" class="label">G</text>
  <text x="318" y="378" class="small">loaded gap</text>
  <line x1="190" y1="295" x2="190" y2="380" class="axis"/>
  <text x="203" y="350" class="small">strike-pad centreline</text>

  <text x="496" y="88" class="label">Plan view at metal backing / fixture ears</text>
  <text x="496" y="108" class="small">Red holes are in exposed metal ears; black is the narrower rubber body</text>
  <rect x="500" y="160" width="282" height="76" rx="8" class="steel"/>
  <rect x="558" y="130" width="166" height="136" rx="8" class="rubber"/>
  <rect x="604" y="170" width="74" height="56" rx="7" class="part"/>
  <text x="584" y="154" class="tiny">rubber body / central fixture-channel</text>

  <circle cx="526" cy="198" r="15" class="hole"/>
  <circle cx="757" cy="198" r="15" class="hole"/>
  <line x1="509" y1="198" x2="543" y2="198" class="hole-axis"/>
  <line x1="526" y1="181" x2="526" y2="215" class="hole-axis"/>
  <line x1="740" y1="198" x2="774" y2="198" class="hole-axis"/>
  <line x1="757" y1="181" x2="757" y2="215" class="hole-axis"/>
  <text x="500" y="255" class="tiny">metal mounting ear 1</text>
  <text x="688" y="255" class="tiny">metal mounting ear 2</text>

  <path d="M526 105 L757 105" class="dim"/>
  <text x="606" y="96" class="label">P ~90 photo nominal</text>
  <text x="588" y="119" class="small">metal-hole pitch, centre to centre</text>
  <path d="M558 284 L724 284" class="dim"/>
  <text x="585" y="307" class="small">rubber span ~65 photo nominal</text>
  <text x="500" y="326" class="small">D / holder thread = direct caliper and thread-gauge measurement</text>
  <path d="M548 315 C568 270 548 218 531 203" class="callout"/>

  <path d="M500 352 L782 352" class="dim"/>
  <text x="580" y="377" class="label">metal fixture length ~110 photo nominal</text>
  <path d="M805 130 L805 266" class="dim"/>
  <text x="819" y="204" class="label">BW measure</text>

  <rect x="54" y="440" width="792" height="82" rx="6" class="callout-box"/>
  <text x="72" y="462" class="small">Photo nominal (nearest 5 mm): long sample H ~70; metal fixture length ~110; rubber span ~65; metal-hole pitch P ~90.</text>
  <text x="72" y="480" class="small">Use these for identification and first-fit screening only. Photo 20260531_171833 is unrelated and excluded.</text>
  <text x="72" y="498" class="small">Directly release BW/D/thread/fixture-channel/X-Y/G/F from calipers, thread gauge, fixture, holder, bracket, and strike pad.</text>
  <text x="72" y="516" class="small">Targets after release: H 70 +/-1 for BUMP-60010 long stops; H 60 +/-1 for BUMP-60020 right front.</text>
</svg>
