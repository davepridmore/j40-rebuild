<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <title>J40 Front Cooling Stack Frame Rev A</title>
  <rect width="900" height="520" fill="#f7f7f4"/>
  <text x="40" y="45" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#222">J40 Front Cooling Stack Frame - Rev A</text>
  <text x="40" y="75" font-family="Arial, sans-serif" font-size="14" fill="#555">Front view plus side stack order. Dimensions are site-fit unless called out in the CSV files.</text>

  <g transform="translate(50 115)">
    <text x="0" y="-18" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#222">Front view</text>
    <rect x="90" y="0" width="32" height="320" fill="#777"/>
    <rect x="470" y="0" width="32" height="320" fill="#777"/>
    <rect x="110" y="20" width="380" height="280" fill="#d8d8d0" stroke="#333" stroke-width="3"/>
    <line x1="110" y1="70" x2="490" y2="70" stroke="#333" stroke-width="2"/>
    <line x1="110" y1="250" x2="490" y2="250" stroke="#333" stroke-width="2"/>
    <rect x="145" y="50" width="310" height="220" fill="none" stroke="#111" stroke-width="2" stroke-dasharray="9 7"/>
    <rect x="155" y="62" width="290" height="196" fill="#b7c7c4" stroke="#4c6662" stroke-width="2"/>
    <line x1="155" y1="90" x2="445" y2="90" stroke="#78908c" stroke-width="2"/>
    <line x1="155" y1="130" x2="445" y2="130" stroke="#78908c" stroke-width="2"/>
    <line x1="155" y1="170" x2="445" y2="170" stroke="#78908c" stroke-width="2"/>
    <line x1="155" y1="210" x2="445" y2="210" stroke="#78908c" stroke-width="2"/>
    <circle cx="300" cy="160" r="72" fill="none" stroke="#222" stroke-width="6"/>
    <circle cx="300" cy="160" r="18" fill="none" stroke="#222" stroke-width="4"/>
    <line x1="300" y1="88" x2="300" y2="232" stroke="#222" stroke-width="4"/>
    <line x1="228" y1="160" x2="372" y2="160" stroke="#222" stroke-width="4"/>
    <rect x="60" y="320" width="472" height="28" fill="#555"/>
    <text x="126" y="342" font-family="Arial, sans-serif" font-size="13" fill="#fff">chassis/front support rail</text>
    <text x="135" y="38" font-family="Arial, sans-serif" font-size="12" fill="#333">radiator rear tabs</text>
    <text x="170" y="286" font-family="Arial, sans-serif" font-size="12" fill="#333">condenser forward tabs + optional fan hoop</text>
    <text x="80" y="370" font-family="Arial, sans-serif" font-size="13" fill="#333">50 x 50 x 4 mm angle uprights preferred; final height and holes site-fit</text>
  </g>

  <g transform="translate(650 125)">
    <text x="0" y="-28" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#222">Side stack order</text>
    <rect x="0" y="0" width="28" height="270" fill="#ddd" stroke="#555"/>
    <text x="-10" y="292" font-family="Arial, sans-serif" font-size="12" fill="#333">grille</text>
    <rect x="60" y="35" width="28" height="200" fill="#222"/>
    <text x="42" y="260" font-family="Arial, sans-serif" font-size="12" fill="#333">fan</text>
    <rect x="120" y="15" width="22" height="240" fill="#a9c9c5" stroke="#4c6662"/>
    <text x="95" y="282" font-family="Arial, sans-serif" font-size="12" fill="#333">condenser</text>
    <line x1="165" y1="15" x2="165" y2="255" stroke="#999" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="150" y="282" font-family="Arial, sans-serif" font-size="12" fill="#333">air gap</text>
    <rect x="205" y="0" width="58" height="270" fill="#d8d8d0" stroke="#333" stroke-width="2"/>
    <text x="205" y="292" font-family="Arial, sans-serif" font-size="12" fill="#333">radiator</text>
    <rect x="315" y="40" width="44" height="190" fill="#777" stroke="#333"/>
    <text x="298" y="260" font-family="Arial, sans-serif" font-size="12" fill="#333">engine fan</text>
    <path d="M30 130 L55 130 M90 130 L115 130 M145 130 L200 130 M265 130 L310 130" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>
</svg>

