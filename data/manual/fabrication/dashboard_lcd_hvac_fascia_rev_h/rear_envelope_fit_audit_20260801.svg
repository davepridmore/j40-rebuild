<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920">
  <defs>
    <style>
      .bg{fill:#f5f1e7}.panel{fill:#eee4d3;stroke:#5f584f;stroke-width:3}.oem{fill:#d7d3ca;stroke:#3c3a36;stroke-width:3}.lcd{fill:#1c252c;stroke:#59636a;stroke-width:4}.vent{fill:#c7c9ca;stroke:#4c5052;stroke-width:4}.ventcore{fill:#202629;stroke:#92989a;stroke-width:2}.switch{fill:#242526;stroke:#080808;stroke-width:2}.hazard{fill:#b23a2c;stroke:#6d1e16;stroke-width:2}.keep{fill:#d8952f;fill-opacity:.24;stroke:#b36b08;stroke-width:3;stroke-dasharray:10 7}.unknown{fill:#b93a32;fill-opacity:.12;stroke:#a62e28;stroke-width:3;stroke-dasharray:10 7}.ok{fill:#287c5a}.hold{fill:#a62e28}.ink{fill:#282724;font-family:Arial,Helvetica,sans-serif}.tiny{font-size:15px}.small{font-size:18px}.body{font-size:21px}.label{font-size:17px;font-weight:700}.head{font-size:30px;font-weight:700}.sub{font-size:22px;font-weight:700}.dim{stroke:#a62e28;stroke-width:3;marker-start:url(#arr);marker-end:url(#arr)}.leader{stroke:#47433e;stroke-width:2;fill:none}.route{stroke:#287c5a;stroke-width:6;fill:none;stroke-linecap:round;stroke-dasharray:12 8}.datum{stroke:#4c6888;stroke-width:2;stroke-dasharray:8 6}.white{fill:#fff}.note{fill:#fffdf8;stroke:#c9c0b0;stroke-width:2}
    </style>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9 z" fill="#a62e28"/></marker>
  </defs>

  <rect class="bg" width="1400" height="920"/>
  <text x="55" y="55" class="ink head">REV H — REAR-ENVELOPE FIT AUDIT</text>
  <text x="55" y="88" class="ink body">Nominal layout check only • actual vehicle + bought parts still control</text>
  <rect x="1095" y="28" width="250" height="62" rx="12" class="hold"/>
  <text x="1220" y="68" text-anchor="middle" class="white sub">PRODUCTION HOLD</text>

  <text x="55" y="132" class="ink sub">A. Right-hand face — critical nominal relationships</text>
  <!-- Face uses X=740..1260, Y=-35..220. Scale 1.92, bottom-up. -->
  <g transform="translate(-1366 577) scale(1.92 -1.92)">
    <path class="panel" d="M740,-35 L852,-35 L852,50 L865,50 L865,82 Q930,110 995,82 L995,50 L1260,50 L1260,220 L740,220 Z"/>
    <rect x="785" y="88" width="290" height="127" rx="8" class="oem"/>
    <rect x="865" y="0" width="130" height="105" class="keep"/>
    <circle cx="796" cy="20" r="43.5" class="vent"/>
    <circle cx="796" cy="20" r="31" class="ventcore"/>
    <circle cx="1210" cy="168.5" r="43.5" class="vent"/>
    <circle cx="1210" cy="168.5" r="31" class="ventcore"/>
    <rect x="1076" y="3" width="179" height="113" class="unknown"/>
    <g>
      <circle cx="1096" cy="88" r="10" class="switch"/><circle cx="1144" cy="88" r="10" class="switch"/><circle cx="1192" cy="88" r="10" class="switch"/><circle cx="1240" cy="88" r="10" class="switch"/>
      <circle cx="1096" cy="30" r="10" class="switch"/><circle cx="1144" cy="30" r="10" class="switch"/><circle cx="1192" cy="30" r="10" class="switch"/><circle cx="1240" cy="30" r="10" class="hazard"/>
    </g>
  </g>
  <text x="150" y="196" class="ink label">OEM SPEEDOMETER / CLUSTER</text>
  <text x="309" y="455" class="ink label">COLUMN + STALK</text>
  <text x="312" y="477" class="ink label">SWEPT KEEP-OUT</text>
  <text x="89" y="548" class="ink label">V3</text>
  <text x="895" y="270" class="ink label">V4</text>
  <text x="751" y="548" class="ink label">2 × 4 CONTROL BANK</text>

  <line x1="1040" y1="252" x2="1053" y2="252" class="dim"/>
  <path d="M1053 252 L1080 252" class="leader"/>
  <text x="1092" y="241" class="ink small hold">6.5 mm rim-to-end land</text>
  <text x="1092" y="265" class="ink small">(12.5 mm at Ø75 cut reference)</text>

  <line x1="1018" y1="337" x2="1018" y2="353" class="dim"/>
  <path d="M1018 345 L1080 345" class="leader"/>
  <text x="1092" y="323" class="ink small ok">25.75 mm rim → Ø22.5 head</text>
  <text x="1092" y="347" class="ink small ok">passes the ≥20 mm face target</text>
  <text x="1092" y="371" class="ink small hold">9 mm rim → bank/label envelope</text>

  <line x1="248" y1="497" x2="296" y2="497" class="dim"/>
  <text x="78" y="475" class="ink small">25.5 mm V3 rim → column keep-out</text>

  <line x1="698" y1="389" x2="700" y2="389" class="dim"/>
  <path d="M699 389 L745 389" class="leader"/>
  <text x="756" y="396" class="ink small hold">1 mm cluster → bank envelope</text>

  <rect x="55" y="600" width="1290" height="262" rx="14" class="note"/>
  <text x="78" y="636" class="ink sub">B. Behind-face packaging rule at V4 and the switch bank</text>
  <line x1="360" y1="675" x2="360" y2="825" stroke="#504b45" stroke-width="7"/>
  <text x="343" y="849" text-anchor="end" class="ink tiny">1.5 mm fascia plane</text>
  <circle cx="310" cy="709" r="40" class="vent"/>
  <circle cx="310" cy="709" r="27" class="ventcore"/>
  <rect x="360" y="684" width="105" height="50" rx="9" class="unknown"/>
  <text x="302" y="662" text-anchor="middle" class="ink small">V4 Ø87 visible face</text>
  <text x="412" y="676" text-anchor="middle" class="ink small">unknown neck depth</text>
  <path d="M465 709 C540 709 535 755 625 755" class="route"/>
  <text x="540" y="784" text-anchor="middle" class="ink small ok">route elbow away from control stacks</text>

  <circle cx="310" cy="808" r="15" class="switch"/>
  <rect x="360" y="792" width="175" height="32" rx="5" class="unknown"/>
  <text x="510" y="849" text-anchor="middle" class="ink tiny">selector + contact blocks: 68 mm reference</text>
  <line x1="486" y1="737" x2="486" y2="789" class="dim"/>
  <text x="505" y="746" class="ink small hold">≥10 mm to stack / terminals / loom</text>

  <rect x="658" y="663" width="650" height="166" rx="12" fill="#f7efe8" stroke="#d2b4a8" stroke-width="2"/>
  <text x="681" y="696" class="ink sub hold">FIT VERDICT — NOT YET DEMONSTRATED</text>
  <text x="681" y="726" class="ink small">Front-face arrangement is plausible, but actual rear envelopes remain unknown.</text>
  <text x="681" y="754" class="ink small">• V4 cannot move farther right: only 6.5 mm rim / 12.5 mm cut-reference land remains.</text>
  <text x="681" y="782" class="ink small">• Straight-on image controls placement. Prove ≥20 mm visible rim-to-nearest selector head;</text>
  <text x="704" y="806" class="ink small">lower/reshape the bank if the measured parts fail.</text>
  <text x="681" y="820" class="ink small">• Release only after full-depth M8/M9 mock-up with LCD, 4 vents, cluster, glovebox and column.</text>

  <text x="55" y="895" class="ink small">Acceptance minima: ≥10 mm fixed rear clearance • ≥20 mm to moving column/shroud/stalk sweep • duct minor axis ≥90% of round ID</text>
</svg>
