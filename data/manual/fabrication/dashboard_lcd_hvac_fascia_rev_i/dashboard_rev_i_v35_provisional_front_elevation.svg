<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600mm" height="460mm" viewBox="-100 -100 1600 460">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="#34495e"/></marker>
    <pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#a66f32" stroke-width="2"/></pattern>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#17222c}.face{fill:#eee8da;stroke:#283b4d;stroke-width:3}.oem{fill:url(#hatch);fill-opacity:.32;stroke:#a66f32;stroke-width:2;stroke-dasharray:9 6}.cass{fill:#d9eef7;stroke:#0076a7;stroke-width:2.5}.screen{fill:#1a2630;stroke:#35a7d8;stroke-width:2}.active{fill:none;stroke:#65d0ff;stroke-width:1.5}.vent{fill:#dfe5e8;stroke:#4f5962;stroke-width:3}.rear{fill:none;stroke:#e07b24;stroke-width:1.5;stroke-dasharray:7 5}.selector{fill:#15191c;stroke:#c4ccd1;stroke-width:2}.hazard{fill:#c22c25;stroke:#c4ccd1;stroke-width:2}.datum{stroke:#5f8294;stroke-width:1;stroke-dasharray:6 5}.dim{fill:none;stroke:#34495e;stroke-width:1.4;marker-start:url(#arrow);marker-end:url(#arrow)}.ext{stroke:#758799;stroke-width:1}.t{font-size:20px}.s{font-size:14px}.xs{font-size:11px}.note{font-size:13px;fill:#6e461e}.screenText{fill:#fff}.screenSubtext{fill:#bde9ff}
    </style>
  </defs>
  <text x="0" y="-78" class="t">J40 dashboard Rev I V35 — provisional exact-scale front elevation (mm)</text>
  <text x="0" y="-55" class="s">X passenger-to-driver (RHD); Y down; Z rear. New geometry is scale-controlled; OEM zones are trace-lock placeholders, not profiles.</text>

  <rect x="0" y="0" width="1400" height="250" rx="18" class="face"/>
  <line x1="700" y1="0" x2="700" y2="250" class="datum"/><line x1="0" y1="125" x2="1400" y2="125" class="datum"/>
  <!-- Deliberately schematic OEM locations: original physical profiles remain untouched and must be traced. -->
  <path d="M225 35 H480 Q500 35 500 55 V190 H225 Z" class="oem"/><text x="362" y="93" text-anchor="middle" class="s">OEM GLOVEBOX</text><text x="362" y="114" text-anchor="middle" class="xs">TRACE-LOCK / UNCHANGED</text>
  <path d="M870 28 H1045 V184 H1010 Q990 184 985 213 Q980 184 960 184 H870 Z" class="oem"/><text x="958" y="87" text-anchor="middle" class="s">OEM CLUSTER</text><text x="985" y="224" text-anchor="middle" class="xs">RHD COLUMN + SCALLOP LOCKED</text>

