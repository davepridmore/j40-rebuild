  <line x1="510" y1="5" x2="510" y2="-32" class="ext"/><line x1="860" y1="5" x2="860" y2="-32" class="ext"/><line x1="510" y1="-18" x2="860" y2="-18" class="dim"/><text x="685" y="-25" text-anchor="middle" class="s">350 candidate free centre field / cassette</text>
