    <text x="545" y="153" text-anchor="middle" class="xs">WIPERS</text><text x="585" y="153" text-anchor="middle" class="xs">LIGHTS</text><text x="625" y="153" text-anchor="middle" class="xs">SPOTS</text><text x="665" y="153" text-anchor="middle" class="xs">AUX</text><text x="705" y="153" text-anchor="middle" class="xs">BLOWER</text><text x="745" y="153" text-anchor="middle" class="xs">A/C</text><text x="785" y="153" text-anchor="middle" class="xs">FUEL</text><text x="825" y="153" text-anchor="middle" class="xs">HAZARD</text>
    <text x="545" y="202" text-anchor="middle" class="xs">3-pos</text><text x="585" y="202" text-anchor="middle" class="xs">3-pos</text><text x="625" y="202" text-anchor="middle" class="xs">2-pos</text><text x="665" y="202" text-anchor="middle" class="xs">2-pos</text><text x="705" y="202" text-anchor="middle" class="xs">3-pos</text><text x="745" y="202" text-anchor="middle" class="xs">2-pos</text><text x="785" y="202" text-anchor="middle" class="xs">RUN/STOP</text><text x="825" y="202" text-anchor="middle" class="xs">2-pos</text>
