  <circle cx="1222.5" cy="70" r="43.5" class="vent"/><circle cx="1222.5" cy="70" r="37.5" class="rear"/><text x="1222.5" y="74" text-anchor="middle" class="xs">Ø87</text>
  <text x="112.5" y="124" text-anchor="middle" class="xs">Ø75 rear target</text><text x="1222.5" y="124" text-anchor="middle" class="xs">Ø75 rear target</text>
  <line x1="0" y1="145" x2="225" y2="145" class="dim"/><text x="112.5" y="140" text-anchor="middle" class="xs">centred in 225 outer land</text>
  <line x1="1045" y1="145" x2="1400" y2="145" class="dim"/><text x="1222.5" y="140" text-anchor="middle" class="xs">centred in 355 outer land</text>

  <rect x="510" y="5" width="350" height="210" rx="18" class="cass"/><text x="685" y="204" text-anchor="middle" class="xs">REMOVABLE CENTRE CASSETTE — 0 mm DOWNWARD EXTENSION</text>
  <rect x="579.45" y="12" width="211.10" height="126.50" rx="3" class="screen"/><rect x="585.545" y="19.305" width="198.91" height="111.89" rx="2" class="active"/>
